<style>
/* ── Navbar ──────────────────────────────────── */
.site-nav{
  display:flex;align-items:center;justify-content:space-between;
  padding:.75rem 1.2rem;
  background:linear-gradient(135deg,#134e4a 0%,#0f766e 60%,#0d9488 100%);
  border-radius:16px;margin-bottom:2rem;
  box-shadow:0 8px 28px rgba(13,148,136,.25);
  position:relative;
}
.site-nav-brand{display:flex;flex-direction:column;text-decoration:none;gap:0}
.site-nav-brand .brand-name{
  font-size:1.15rem;font-weight:900;color:#fff;
  letter-spacing:-.01em;line-height:1.2}
.site-nav-brand .brand-sub{
  font-size:.75rem;color:rgba(255,255,255,.65);font-weight:500;line-height:1.3}

/* Desktop links */
.site-nav-links{
  display:flex;align-items:center;gap:.2rem;flex-wrap:wrap;
}
.site-nav-links a{
  padding:.42rem .8rem;border-radius:999px;font-size:.85rem;font-weight:700;
  color:rgba(255,255,255,.8);text-decoration:none;
  transition:background .15s,color .15s;
  white-space:nowrap;
}
.site-nav-links a:hover{background:rgba(255,255,255,.15);color:#fff}
.site-nav-links a.active{background:rgba(255,255,255,.2);color:#fff;
  box-shadow:0 0 0 1px rgba(255,255,255,.3)}
.site-nav-links a.nav-cv{
  background:rgba(255,255,255,.18);color:#fff;
  border:1px solid rgba(255,255,255,.4);
  padding:.38rem .85rem}
.site-nav-links a.nav-cv:hover{background:rgba(255,255,255,.28)}

/* Hamburger (mobile) */
.nav-toggle{
  display:none;flex-direction:column;gap:4px;cursor:pointer;
  padding:.4rem;border:none;background:transparent;
}
.nav-toggle span{
  display:block;width:22px;height:2px;
  background:rgba(255,255,255,.85);border-radius:2px;
  transition:transform .2s,opacity .2s}

@media(max-width:680px){
  .nav-toggle{display:flex}
  .site-nav-links{
    display:none;flex-direction:column;align-items:stretch;gap:.3rem;
    position:absolute;top:100%;left:0;right:0;z-index:100;
    background:linear-gradient(135deg,#134e4a,#0d9488);
    border-radius:0 0 16px 16px;
    padding:.8rem 1rem;margin-top:.3rem;
    box-shadow:0 12px 28px rgba(13,148,136,.3);
  }
  .site-nav-links.open{display:flex}
  .site-nav-links a{padding:.6rem .9rem;border-radius:10px;font-size:.92rem}
  .site-nav{flex-wrap:wrap}
}
</style>

<nav class="site-nav" role="navigation" aria-label="Main navigation">

  <!-- Brand -->
  <a class="site-nav-brand" href="{{ site.github.url }}/">
    <span class="brand-name">{{ site.title }}</span>
    <span class="brand-sub">{{ site.description }}</span>
  </a>

  <!-- Hamburger button (mobile) -->
  <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false"
    onclick="var m=document.getElementById('nav-menu');var open=m.classList.toggle('open');this.setAttribute('aria-expanded',open)">
    <span></span><span></span><span></span>
  </button>

  <!-- Links -->
  <div class="site-nav-links" id="nav-menu" role="menubar">
    {% for item in site.data.settings.menu %}
      {% if item.name == "CV" %}
        <a class="nav-cv" href="{{ site.github.url }}/publications/Md_Babul_Islam_CV_2023.pdf"
           target="_blank" rel="noopener">📄 CV</a>
      {% elsif item.name == "Services" %}
        <a href="{{ site.github.url }}/services"
          {% if page.url == "/services" or page.url == "/services/" %}class="active"{% endif %}>
          {{ item.name }}
        </a>
      {% else %}
        <a href="{{ site.github.url }}{{ item.url }}"
          {% assign url_slash = item.url | append: "/" %}{% if page.url == item.url or page.url == url_slash %}class="active"{% endif %}>
          {{ item.name }}
        </a>
      {% endif %}
    {% endfor %}
  </div>
</nav>
